<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<title>OS Toolsmith</title>
<style>
:root{--bg:#0b0f14;--panel:#111821;--panel2:#17212c;--text:#edf3f8;--muted:#91a0ae;--accent:#5aa9ff;--danger:#ff6575;--border:#263342}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:#0d131a;position:sticky;top:0;z-index:2}
h1{font-size:17px;margin:0}.badge{font-size:11px;color:#8fd3ff;border:1px solid #285579;padding:3px 7px;border-radius:999px;margin-left:7px}
main{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--border);padding:12px;background:#0e151d}.nav{display:block;width:100%;padding:10px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:8px;margin-bottom:4px}.nav:hover,.nav.active{background:var(--panel2)}
section{padding:16px;max-width:1100px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}.muted{color:var(--muted)}button{background:#1b2a3a;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px}button.primary{background:#1769aa;border-color:#2786d0}button.danger{background:#4b1820;border-color:#78313b}input,textarea,select{width:100%;background:#0a0f14;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px}textarea{min-height:280px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.terminal{background:#050709;border:1px solid var(--border);border-radius:10px;padding:12px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;min-height:310px;white-space:pre-wrap}.prompt{color:#6fe58c}.hidden{display:none}.file{padding:8px;border-radius:7px}.file:hover{background:var(--panel2)}
@media(max-width:700px){main{display:block}aside{border-right:0;border-bottom:1px solid var(--border);display:flex;overflow:auto;gap:4px}.nav{min-width:max-content;margin:0}section{padding:12px}}
</style>
</head>
<body>
<header><h1>OS Toolsmith <span class="badge">ADMIN-READY</span></h1><div class="row"><button id="installBtn" class="primary">Install</button></div></header>
<main>
<aside>
<button class="nav active" data-page="dashboard">Dashboard</button>
<button class="nav" data-page="editor">Code Editor</button>
<button class="nav" data-page="terminal">Terminal</button>
<button class="nav" data-page="projects">Projects</button>
<button class="nav" data-page="admin">Admin</button>
</aside>
<div id="app"></div>
</main>
<script src="app.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OS Toolsmith Terminal</title>
  
  <!-- xterm.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Status Bar Control Panel */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      font-size: 14px;
      height: 40px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #f39c12; /* Default yellow: Connecting */
      transition: background-color 0.3s ease;
    }

    /* Terminal Viewport Container */
    #terminal-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 60px);
      padding: 4px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Header Control Panel & Status -->
    <div id="status-bar">
      <div class="status-indicator">
        <div id="status-dot"></div>
        <span id="status-text">Connecting to backend...</span>
      </div>
      <div><strong>OS Toolsmith</strong></div>
    </div>

    <!-- Terminal Display -->
    <div id="terminal-container"></div>
  </div>

  <!-- xterm.js and Fit Addon CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>

  <script>
    // 1. Initialize xterm.js Terminal optimized for mobile sizing
    const term = new Terminal({
      cursorBlink: true,
      macOptionIsMeta: true,
      fontSize: 14,
      theme: {
        background: '#121212',
        foreground: '#f8f8f2',
        cursor: '#50fa7b'
      }
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // Open terminal inside the UI container
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    // 2. Setup WebSocket Connection with JWT Auth Token
    // In production, inject your dynamically generated JWT token here
    const token = "your_test_or_user_jwt_token_here";
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const host = window.location.host || 'localhost:3000';
    const wsUrl = `${protocol}${host}?token=${encodeURIComponent(token)}`;

    const ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    ws.onopen = () => {
      statusDot.style.backgroundColor = '#2ecc71'; // Green: Connected
      statusText.textContent = 'Connected (Secure Sandbox)';
      fitAddon.fit();
      // Send initial sizing to backend PTY
      sendResize();
    };

    ws.onclose = () => {
      statusDot.style.backgroundColor = '#e74c3c'; // Red: Disconnected
      statusText.textContent = 'Disconnected - Reconnecting...';
      term.writeln('\r\n\x1b[31m[Connection lost. Attempting to reconnect...]\x1b[0m');
    };

    ws.onerror = () => {
      statusDot.style.backgroundColor = '#e74c3c';
      statusText.textContent = 'Connection Error';
    };

    // 3. Handle data coming from backend PTY -> render in xterm.js
    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) {
        term.write(new Uint8Array(event.data));
      } else {
        term.write(event.data);
      }
    };

    // 4. Handle user input in xterm.js -> send to backend PTY
    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data: data }));
      }
    });

    // 5. Dynamic Resize Handling (Crucial for iPhone orientation shifts/keyboards)
    function sendResize() {
      if (ws.readyState === WebSocket.OPEN) {
        fitAddon.fit();
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows
        }));
      }
    }

    window.addEventListener('resize', () => {
      sendResize();
    });

    // Handle mobile visual viewport changes (e.g., virtual keyboard pop-ups)
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        setTimeout(sendResize, 100);
      });
    }
  </script>
</body>
</html>
<button onclick="switchTab('admin')" id="btn-admin" style="display: none;">Admin</button>
